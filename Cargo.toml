[package]
name = "rnc"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
description = "A byte-safe netcat with native Windows Unicode console support"
license = "MIT"
repository = "https://github.com/jacek4yang/rnc"
readme = "README.md"
keywords = ["netcat", "windows", "tcp", "udp", "ctf"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "nc"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8.35"
ctrlc = "3.5"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "paths"
harness = false
