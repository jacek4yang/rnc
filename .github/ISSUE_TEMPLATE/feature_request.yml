name: Feature request
description: Suggest an improvement to the documented netcat workflow.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what is missing from the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include example commands and relevant compatibility considerations.
    validations:
      required: true
